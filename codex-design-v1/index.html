<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Team AI — прототип «Тихий общий тред»</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:Geist;src:url("fonts/geist-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:Geist;src:url("fonts/geist-cyrillic-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap;unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Geist;src:url("fonts/geist-cyrillic-ext-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap;unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F}
:root{
  --rail:#f1f1f0;--side:#f7f7f6;--bg:#fff;--line:#e7e7e4;--line2:#f0f0ee;
  --ink:#151515;--ink2:#53534f;--ink3:#8c8c87;--hov:rgba(0,0,0,.045);--act:rgba(0,0,0,.072);
  --blue:#2563eb;--r:8px;--insp-w:300px;--col:680px;
  --font:"Geist","Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.45 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
input,textarea,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:14px;height:14px}
mark{background:#f1efe6;color:inherit;border-radius:3px;padding:0 1px}
kbd{font:11px var(--mono);color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#fff}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;height:100dvh}
.nav{display:flex;flex:none;height:100%}
.rail{width:48px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0 12px;gap:4px}
.mark{width:28px;height:28px;display:grid;place-items:center;margin-bottom:10px}
.mark i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);position:relative;display:block}
.mark i::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--ink);right:-5px;bottom:-5px;box-shadow:0 0 0 2px var(--rail)}
.rail-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink2)}
.rail-btn:hover{background:var(--hov);color:var(--ink)}
.rail-btn[aria-current="page"]{background:var(--act);color:var(--ink)}
.rail-sp{flex:1}
.rail .av{width:28px;height:28px;font-size:11px}
.side{width:240px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-head{padding:12px 12px 6px}
.team{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.team b{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team small{display:block;font-size:11.5px;color:var(--ink3)}
.team-mark{width:22px;height:22px;border-radius:6px;background:#e4e4e1;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink2);flex:none}
.side-item{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border-radius:7px;color:var(--ink2);font-size:13.5px}
.side-item:hover{background:var(--hov);color:var(--ink)}
.side-item[aria-current="page"]{background:var(--act);color:var(--ink)}
.side-item .cnt{margin-left:auto;font-size:12px;color:var(--ink3)}
.filter{position:relative;margin:6px 0 2px}
.filter .ic{position:absolute;left:8px;top:8px;color:var(--ink3);width:14px;height:14px}
.filter input{width:100%;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 8px 0 28px;font-size:13px}
.filter input::placeholder{color:var(--ink3)}
.side-list{flex:1;overflow:auto;padding:4px 12px 12px}
.side-label{font-size:12px;color:var(--ink3);padding:14px 8px 4px;display:flex;align-items:center}
.proj-row{display:flex;align-items:center;border-radius:7px;height:30px}
.proj-row:hover{background:var(--hov)}
.proj-row.cur{background:var(--act)}
.chev{width:22px;height:30px;display:grid;place-items:center;color:var(--ink3);flex:none;border-radius:6px}
.chev .ic{width:12px;height:12px;transition:transform .15s}
.chev[aria-expanded="true"] .ic{transform:rotate(90deg)}
.proj-link{flex:1;min-width:0;display:flex;align-items:center;gap:7px;height:30px;font-size:13.5px;color:var(--ink)}
.proj-link span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-link .ic{color:var(--ink2)}
.proj-add{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--ink3);opacity:0}
.proj-row:hover .proj-add,.proj-add:focus-visible{opacity:1}
.proj-add:hover{background:var(--hov);color:var(--ink)}
.threads{list-style:none;margin:0 0 4px;padding:0}
.thr{display:flex;align-items:center;gap:6px;height:29px;padding:0 8px 0 30px;border-radius:7px;color:var(--ink2);font-size:13.5px}
.thr:hover{background:var(--hov);color:var(--ink)}
.thr[aria-current="page"]{background:var(--act);color:var(--ink)}
.thr .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr .ago{font-size:12px;color:var(--ink3);flex:none}
.thr.unread .tt{color:var(--ink);font-weight:550}
.udot{width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none}
.side-foot{border-top:1px solid var(--line);padding:8px 12px 10px}
.side-foot p{margin:6px 8px 0;font-size:11.5px;color:var(--ink3);line-height:1.4}
.empty-note{font-size:12.5px;color:var(--ink3);padding:8px}

.work{flex:1;min-width:0;display:flex}
.center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.top{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;border-bottom:1px solid var(--line2)}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;font-size:13.5px;color:var(--ink3)}
.crumbs a:hover{color:var(--ink)}
.crumbs .cur{color:var(--ink);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.top-sp{flex:1}
.shared{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 6px;white-space:nowrap;flex:none}
.faces{display:flex;align-items:center;padding-left:4px}
.faces .av{margin-left:-6px;box-shadow:0 0 0 2px #fff}
.demo-tag{font-size:11px;letter-spacing:.02em;color:var(--ink3);border:1px dashed #cfcfca;border-radius:999px;padding:1px 7px;white-space:nowrap}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;position:relative}
.col{max-width:calc(var(--col) + 48px);margin:0 auto;padding:28px 24px 40px}
.col.wide{max-width:808px}

/* ---------- controls ---------- */
.btn{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:#fff;display:inline-flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:#f6f6f5}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2c2c2c}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--hov);color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--act);border-color:transparent}
.icon-btn{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--ink2);flex:none}
.icon-btn:hover{background:var(--hov);color:var(--ink)}
.icon-btn[aria-pressed="true"]{color:var(--ink);background:var(--act)}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:2px;text-decoration-color:#bdbdb8}
.link:hover{text-decoration-color:var(--ink)}
.only-m{display:none!important}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:16px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink2);white-space:nowrap;background:#fff}
.tag.dash{border-style:dashed}
.tag.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.inp{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
textarea.inp{height:auto;padding:8px 10px;line-height:1.5;resize:vertical}
.inp:focus{border-color:#bdbdb8;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.field{margin:0 0 14px}
.field>label,.flabel{display:block;font-size:12.5px;color:var(--ink2);margin:0 0 6px}

/* ---------- avatars ---------- */
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:600;background:var(--tone,#e4e4e1);color:#3b3b39;position:relative;flex:none;letter-spacing:.02em}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px #fff}
.av.bot{border-radius:7px;background:#fff;border:1px dashed #b5b5b0;color:var(--ink2)}
.av.bot .ic{width:14px;height:14px}
.av.lg{width:32px;height:32px;font-size:11.5px}

/* ---------- thread ---------- */
.ctx{font-size:12.5px;color:var(--ink3);margin:0 0 18px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-radius:10px}
.msg .av{margin-top:1px}
.msg-head{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:13px;margin-bottom:2px}
.msg-name{font-weight:600}
.you{font-size:11px;color:var(--ink3)}
.msg-time{font-size:12px;color:var(--ink3)}
.msg-body{font-size:15px;line-height:1.62;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .msg-body{color:#222}
.to-bot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);margin:2px 0 4px}
.nogen{font-size:12px;color:var(--ink3);margin-top:6px;display:flex;gap:6px;align-items:center}
.msg.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:#f1efe6}100%{background:transparent}}
.ref{display:flex;align-items:center;gap:8px;max-width:100%;margin-top:8px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px}
.ref:hover{border-color:#d4d4cf;background:#fafaf9}
.ref-t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-v{font:12px var(--mono);color:var(--ink2)}
.ref-new{font-size:11.5px;color:var(--ink3)}
.ev{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:8px 0 8px 38px;font-size:13px;color:var(--ink2)}
.ev .ic{color:var(--ink3)}
.ev .msg-time{margin-left:2px}
.ev .ref{margin:0;padding:3px 8px;font-size:12.5px}
.ev-note{flex-basis:100%;font-size:12.5px;color:var(--ink3);padding-left:22px}
.handoff{margin:10px 0 10px 38px;padding:10px 12px;border:1px solid var(--line);border-left:2px solid var(--ink);border-radius:4px 10px 10px 4px;background:#fafaf9}
.handoff-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.handoff-h b{font-weight:600}
.handoff q{display:block;margin-top:6px;font-size:14px;line-height:1.55;color:#2a2a2a;quotes:none;white-space:pre-wrap;overflow-wrap:anywhere}
.handoff small{display:block;margin-top:6px;font-size:12px;color:var(--ink3)}
.newdiv{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px;color:var(--ink);font-weight:550}
.newdiv::before,.newdiv::after{content:"";flex:1;height:1px;background:var(--ink);opacity:.18}
.quiet{min-height:calc(100dvh - 48px - 160px);display:grid;place-items:center;text-align:center;padding:24px 0}
.quiet h2{font-size:22px;font-weight:500;letter-spacing:-.015em;margin:0 0 8px;color:var(--ink)}
.quiet p{margin:0 auto;color:var(--ink3);font-size:13.5px;max-width:380px}
.quiet .ev{justify-content:center;padding-left:0;margin-top:14px}

/* ---------- composer ---------- */
.composer-wrap{flex:none;padding:0 24px 16px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 14px)}
.composer{max-width:var(--col);margin:0 auto;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 20px rgba(0,0,0,.04);padding:8px 8px 6px 12px}
.composer:focus-within{border-color:#d2d2cd}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:not(:empty){margin:2px 0 6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;max-width:100%;padding:0 4px 0 8px;border-radius:7px;background:#f3f3f1;font-size:12.5px;color:var(--ink)}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.chip button{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--ink3)}
.chip button:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.composer textarea{display:block;width:100%;border:0;resize:none;outline:0;font-size:15px;line-height:1.5;padding:4px 2px;max-height:200px;min-height:30px;background:transparent}
.composer textarea::placeholder{color:var(--ink3)}
.comp-bar{display:flex;align-items:center;gap:2px;margin-top:2px}
.comp-bar .btn.ghost{height:28px;padding:0 8px;font-size:12.5px}
.comp-hint{flex:1;min-width:0;text-align:right;font-size:11.5px;color:var(--ink3);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send{width:30px;height:30px;border-radius:50%;background:#dcdcd8;color:#fff;display:grid;place-items:center;flex:none}
.send.ready{background:var(--blue)}
.send .ic{stroke-width:2}

/* ---------- lists / pages ---------- */
.page-head{margin:4px 0 22px}
.eyebrow{font-size:12px;color:var(--ink3);margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1.ph{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.lead{margin:0;color:var(--ink2);font-size:14px;max-width:560px}
.sec{margin:30px 0 0}
.sec-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:0 0 6px}
.sec-h small{font-weight:400;color:var(--ink3);font-size:12.5px}
.sec-h .btn{margin-left:auto}
.rows{border-top:1px solid var(--line)}
.row-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:9px 6px;border-bottom:1px solid var(--line2);text-align:left}
.row-item:hover{background:#fafaf9}
.row-item[aria-pressed="true"]{background:#f4f4f2}
.row-main{display:block;flex:1;min-width:0;overflow:hidden}
.row-t{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.row-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-r{font-size:12px;color:var(--ink3);white-space:nowrap;flex:none;display:flex;align-items:center;gap:8px}
.row-ic{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex:none;background:#fff}
.people{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px}
.person{display:flex;align-items:center;gap:8px;font-size:13px}
.person small{display:block;color:var(--ink3);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.toolbar .filter{flex:1;min-width:200px;margin:0}
.toolbar .filter input{height:32px}
.toolbar .filter .ic{top:9px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--act);color:var(--ink)}
.note{font-size:12.5px;color:var(--ink3);margin:14px 0 0}
.newb{font-size:11px;color:#fff;background:var(--ink);border-radius:999px;padding:0 6px;line-height:16px;white-space:nowrap}

/* ---------- document ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafaf9;font-size:13px;color:var(--ink2);margin:0 0 16px}
.banner .ic{margin-top:2px;color:var(--ink)}
.banner b{color:var(--ink);font-weight:600}
.banner ul{margin:4px 0 0;padding-left:16px}
.doc-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 6px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.doc-meta{font-size:12.5px;color:var(--ink3);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;min-width:200px}
.doc-actions{display:flex;gap:6px;flex-wrap:wrap}
.doc{font-size:15.5px;line-height:1.7;color:#1d1d1d;overflow-wrap:anywhere}
.doc h1{font-size:28px;line-height:1.25;letter-spacing:-.02em;font-weight:600;margin:22px 0 10px}
.doc h2{font-size:17px;font-weight:600;margin:26px 0 6px}
.doc p{margin:0 0 10px}
.doc ul{margin:0 0 10px;padding-left:20px}
.doc li{margin:2px 0}
.tbl{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl th{font-weight:600;color:var(--ink2);background:#fafaf9;font-size:12.5px}
.tbl tr:last-child td{border-bottom:0}
.diff{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;font:13px/1.6 var(--mono)}
.dl{padding:1px 12px 1px 28px;white-space:pre-wrap;overflow-wrap:anywhere;position:relative;min-height:1.6em}
.dl::before{position:absolute;left:10px;color:var(--ink3)}
.dl.add{background:#eef5ee}.dl.add::before{content:"+";color:#3d6b3d}
.dl.del{background:#f8eeee;color:#8a5b5b;text-decoration:line-through;text-decoration-color:rgba(138,91,91,.4)}.dl.del::before{content:"−";color:#8a5b5b}
.diff-legend{font-size:12px;color:var(--ink3);margin-top:14px}
.edit textarea{min-height:46vh;font:14px/1.65 var(--mono);resize:vertical}
.edit-bar{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.edit-bar .hint{flex:1;min-width:200px;font-size:12px;color:var(--ink3)}

/* ---------- inspector ---------- */
.insp{width:var(--insp-w);flex:none;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.insp-head{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line2)}
.insp-head .t{flex:1}
.tabs{display:flex;gap:4px;padding:0 10px;border-bottom:1px solid var(--line2);flex:none}
.tab{padding:9px 6px 8px;font-size:12.5px;color:var(--ink3);border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.insp-body{overflow:auto;flex:1;padding:12px 14px 20px}
.ins-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border-radius:8px;text-align:left}
.ins-row:hover{background:var(--hov)}
.ins-row .row-ic{width:26px;height:26px}
.ins-row b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-row small{display:block;color:var(--ink3);font-size:12px}

/* ------------------------------------------------------------------ markdown-lite (escaped) */
function md(body){
  var out='',list=false,table=null;
  function flush(){if(list){out+='</ul>';list=false}if(table!==null){out+=table+'</tbody></table></div>';table=null}}
  String(body).split('\n').forEach(function(l){
    if(l.indexOf('# ')===0){flush();out+='<h1>'+esc(l.slice(2))+'</h1>'}
    else if(l.indexOf('## ')===0){flush();out+='<h2>'+esc(l.slice(3))+'</h2>'}
    else if(l.indexOf('- ')===0){if(table!==null)flush();if(!list){out+='<ul>';list=true}out+='<li>'+esc(l.slice(2))+'</li>'}
    else if(l.indexOf(' | ')>-1){
      if(list){out+='</ul>';list=false}
      var cells=l.split(' | ');
      if(table===null){out+='<div class="tbl"><table><thead><tr>'+cells.map(function(c){return '<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>';table=''}
      else table+='<tr>'+cells.map(function(c){return '<td>'+esc(c)+'</td>'}).join('')+'</tr>';
    }
    else if(!l.trim())flush();
    else{flush();out+='<p>'+esc(l)+'</p>'}
  });
  flush();return out;
}
function diffLines(a,b){
  var A_=a.split('\n'),B_=b.split('\n'),n=A_.length,m=B_.length;
  if(n*m>2000000)return null;
  var L=[],i,j;for(i=0;i<=n;i++){L.push(new Uint16Array(m+1))}
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)L[i][j]=A_[i]===B_[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  var out=[];i=0;j=0;
  while(i<n&&j<m){if(A_[i]===B_[j]){out.push([' ',A_[i]]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){out.push(['-',A_[i]]);i++}else{out.push(['+',B_[j]]);j++}}
  while(i<n)out.push(['-',A_[i++]]);while(j<m)out.push(['+',B_[j++]]);
  return out;
}
function hl(text,q){if(!q)return esc(text);var i=text.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(text);return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}
function snip(text,q){text=text.replace(/\n+/g,' ');var i=text.toLowerCase().indexOf(q.toLowerCase());var s=Math.max(0,i-36);return (s?'…':'')+text.slice(s,s+120)+(s+120<text.length?'…':'')}

/* ------------------------------------------------------------------ routing */
function parse(){
  var p=location.hash.replace(/^#\/?/,'').split('/').map(function(x){try{return decodeURIComponent(x)}catch(e){return ''}});
  if(p[0]==='t'&&p[1])return {v:'thread',tid:p[1]};
  if(p[0]==='p'&&p[1])return {v:'project',pid:p[1]};
  if(p[0]==='a'&&p[1])return {v:'doc',aid:p[1],ver:p[2]==='v'?parseInt(p[3],10)||null:null};
  if(p[0]==='bots')return {v:'bots',bid:p[1]||null};
  if(p[0]==='artifacts')return {v:'artifacts'};
  return {v:'home'};
}
function onRoute(){
  var r=parse();closePop(true);U.drawer=null;
  if(r.v==='thread'){
    var t=T(r.tid);if(!t){location.replace('#/');return}
    var s=S.seen[S.persona].t[t.id]||0;
    U.newFrom=unread(t.id)>0?{tid:t.id,idx:s}:null;
    S.seen[S.persona].t[t.id]=S.msgs[t.id].length;
    if(S.lastThread!==t.id){U.inspArt=null;U.inspNew=null}
    S.lastThread=t.id;
  }
  if(r.v==='project'&&!PR(r.pid)){location.replace('#/');return}
  if(r.v==='doc'){
    var a=A(r.aid);if(!a){location.replace('#/artifacts');return}
    if(r.ver&&(r.ver<1||r.ver>=a.versions.length))r.ver=null;
    var f=artNewFrom(a.id);
    if(f!==null)U.docNew={aid:a.id,from:f};else if(!U.docNew||U.docNew.aid!==a.id)U.docNew=null;
    markSeenA(a.id);
    if(r.ver)U.edit=false;
  }else{U.edit=false;U.diff=false;U.docNew=null}
  if(r.v==='bots'&&r.bid&&S.bots.some(function(b){return b.id===r.bid}))U.selBot=r.bid;
  U.route=r;save();renderAll();afterRoute();
}
function afterRoute(){
  var sc=$('#scroll'),r=U.route;
  requestAnimationFrame(function(){
    if(r.v==='thread'){
      if(U.flash){var el=document.getElementById('msg-'+U.flash);U.flash=null;if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');return}}
      var d=$('.newdiv');if(d){d.scrollIntoView({block:'center'});return}
      sc.scrollTop=sc.scrollHeight;
    }else sc.scrollTop=0;
    if(r.v==='doc'&&U.edit){var ta=$('#artBody');if(ta)ta.focus()}
  });
}

  var r=U.route,h='<button class="icon-btn only-m" type="button" data-act="menu" aria-label="Открыть навигацию">'+ic('menu')+'</button>';
  var hasInsp=['thread','doc','bots'].indexOf(r.v)>-1;
  if(r.v==='thread'){
    var t=T(r.tid),p=PR(t.pid);
    h+='<nav class="crumbs" aria-label="Путь"><a class="c" href="#/p/'+p.id+'">'+esc(p.name)+'</a><span class="sep" aria-hidden="true">/</span><span class="cur">'+esc(t.title)+'</span></nav>';
    h+='<span class="shared hide-m" title="Тред открыт всем участникам команды">'+ic('users','sm')+'Общий</span>';
    h+='<span class="top-sp"></span><span class="demo-tag hide-m" title="Все данные вымышлены, модель не подключена">демо</span>';
    h+='<div class="faces hide-m" aria-label="Участники треда">'+participants(t).map(function(id){return avatar(id)}).join('')+'</div>';
    h+='<button class="btn ghost" type="button" data-act="handoff" title="Сменить ответственного">'+ic('handoff')+'<span class="hide-m">Передать</span><span class="sr">тред</span></button>';
  }else if(r.v==='doc'){
    var a=A(r.aid),tt=T(a.tid);
    h+='<nav class="crumbs" aria-label="Путь"><a class="c" href="#/artifacts">Артефакты</a><span class="sep" aria-hidden="true">/</span>'+(tt?'<a class="c" href="#/t/'+tt.id+'">'+esc(tt.title)+'</a><span class="sep" aria-hidden="true">/</span>':'')+'<span class="cur">'+esc(a.title)+'</span></nav><span class="top-sp"></span><span class="demo-tag hide-m">демо</span>';
  }else{
    var title={home:'Обзор команды',bots:'Боты',artifacts:'Артефакты',project:(PR(r.pid)||{}).name}[r.v];
    h+='<nav class="crumbs" aria-label="Путь">'+(r.v==='project'?'<a class="c" href="#/">Обзор</a><span class="sep" aria-hidden="true">/</span>':'')+'<span class="cur">'+esc(title)+'</span></nav><span class="top-sp"></span><span class="demo-tag hide-m">демо</span>';
    h+='<button class="icon-btn" type="button" data-act="search" aria-label="Поиск">'+ic('search')+'</button>';
  }
  if(hasInsp){
    var pressed=isSmall()?U.drawer==='insp':S.inspDesk;
    h+='<button class="icon-btn" type="button" data-act="insp" aria-pressed="'+pressed+'" aria-controls="insp" title="Инспектор" aria-label="Показать или скрыть инспектор">'+ic('panel')+'</button>';
  }
  $('#top').innerHTML=h;
}

/* ------------------------------------------------------------------ views */
function renderView(){
  var r=U.route,v=$('#view');
  if(r.v==='thread')v.innerHTML=viewThread(T(r.tid));
  else if(r.v==='project')v.innerHTML=viewProject(PR(r.pid));
  else if(r.v==='doc')v.innerHTML=viewDoc(r);
  else if(r.v==='bots')v.innerHTML=viewBots();
  else if(r.v==='artifacts'){v.innerHTML=viewArts();renderArtList()}
  else v.innerHTML=viewHome();
}
function refsHTML(refs){
  return (refs||[]).map(function(r){var a=A(r.a);if(!a)return '';var L=last(a).n;
    return '<button class="ref" type="button" data-act="refOpen" data-aid="'+a.id+'" aria-label="Открыть артефакт «'+esc(a.title)+'» в инспекторе">'+ic(artIcon(a))+'<span class="ref-t">'+esc(a.title)+'</span><span class="ref-v">v'+r.v+'</span>'+(L>r.v?'<span class="ref-new">· актуальна v'+L+'</span>':'')+'</button>'}).join('');
}
function evHTML(m){
  var t='<span class="msg-time">'+esc(timeOf(m))+'</span>';
  if(m.ev==='handoff'){
    return '<div class="handoff" id="msg-'+m.id+'"><div class="handoff-h">'+ic('handoff')+'<b>'+esc(nm(m.a))+'</b> '+g(m.a,'передал')+' тред <b>'+esc(P(m.to).dat)+(me(m.to)?' (вам)':'')+'</b>'+t+'</div>'+(m.note?'<q>'+esc(m.note)+'</q>':'')+'<small>Ответственный теперь — '+esc(P(m.to).short)+'. Доступ у команды не меняется.</small></div>';
  }
  var body='';
  if(m.ev==='create')body=ic('plus')+'<span>'+esc(nm(m.a))+' '+g(m.a,'создал')+' тред</span>'+t;
  else if(m.ev==='join')body=ic('users')+'<span>'+esc(nm(m.a))+' '+(P(m.a).f?'присоединилась':'присоединился')+' к треду</span>'+t;
  else if(m.ev==='artifact'){var r=(m.refs||[])[0]||{};
    body=ic('history')+'<span>'+esc(nm(m.a))+' '+g(m.a,'сохранил')+' версию v'+esc(r.v)+'</span>'+refsHTML(m.refs)+t+(m.note?'<span class="ev-note">«'+esc(m.note)+'»</span>':'');}
  return '<div class="ev" id="msg-'+m.id+'">'+body+'</div>';
}
function msgHTML(m){
  if(m.k==='ev')return evHTML(m);
  if(m.k==='ai'){var b=B(m.bot);
    return '<article class="msg ai" id="msg-'+m.id+'">'+botAv()+'<div class="msg-main"><div class="msg-head"><span class="msg-name">'+esc(b.name)+'</span><span class="tag dash" title="Модель не вызывалась — текст заранее записан для прототипа">статичный пример</span><span class="msg-time">по запросу '+esc(P(m.by).gen)+' · '+esc(timeOf(m))+'</span></div><div class="msg-body">'+esc(m.text)+'</div>'+refsHTML(m.refs)+'</div></article>';
  }
  var local=!!m.t;
  return '<article class="msg" id="msg-'+m.id+'">'+avatar(m.a)+'<div class="msg-main"><div class="msg-head"><span class="msg-name">'+esc(P(m.a).name)+'</span>'+(me(m.a)?'<span class="you">вы</span>':'')+'<span class="msg-time">'+esc(timeOf(m))+'</span>'+(local?'<span class="tag" title="Сохранено только в этом браузере">локально</span>':'')+'</div>'+
    (m.bot?'<div class="to-bot">'+ic('bot','sm')+'для бота «'+esc(B(m.bot).name)+'»</div>':'')+
    (m.text?'<div class="msg-body">'+esc(m.text)+'</div>':'')+refsHTML(m.refs)+
    (m.bot&&local?'<div class="nogen">'+ic('info','sm')+'Ответ не генерируется: модель в прототипе не подключена.</div>':'')+'</div></article>';
}
function viewThread(t){
  var ms=S.msgs[t.id]||[],p=PR(t.pid);
  var content=ms.filter(function(m){return m.k!=='ev'||m.ev==='handoff'||m.ev==='artifact'});
  if(!content.length){
    return '<div class="col"><div class="quiet"><div><h2>С чего начнём в «'+esc(t.title)+'»?</h2><p>Тред видят все участники команды «'+esc(S.team.name)+'». Напишите сообщение, выберите бота или сошлитесь на артефакт проекта.</p>'+ms.map(msgHTML).join('')+'</div></div></div>';
  }
  var h='<div class="col"><div class="ctx">'+ic('folder','sm')+'<span>'+esc(p.name)+'</span><span>·</span><span>Ответственный: '+esc(nm(t.owner))+'</span><span>·</span><span>Открыт всей команде</span></div>';
  ms.forEach(function(m,i){
    if(U.newFrom&&U.newFrom.tid===t.id&&i===U.newFrom.idx)h+='<div class="newdiv" role="separator">Новое с вашего последнего визита</div>';
    h+=msgHTML(m);
  });
  return h+'</div>';
}
function threadRow(t){
  var u=unread(t.id);
  return '<a class="row-item" href="#/t/'+t.id+'"><span class="row-ic">'+ic('thread','sm')+'</span><span class="row-main"><span class="row-t"><span>'+esc(t.title)+'</span>'+(u?'<span class="newb">'+u+' нов.</span>':'')+'</span><span class="row-s">'+esc(PR(t.pid).name)+' · ответственный '+esc(nm(t.owner))+'</span></span><span class="row-r">'+avatar(t.owner)+'<span class="hide-s">'+esc(ago(t))+'</span></span></a>';
}
function artRow(a){
  var l=last(a),nw=artNewFrom(a.id)!==null,t=T(a.tid);
  return '<a class="row-item" href="#/a/'+a.id+'"><span class="row-ic">'+ic(artIcon(a),'sm')+'</span><span class="row-main"><span class="row-t"><span>'+esc(a.title)+'</span>'+(nw?'<span class="newb">v'+l.n+' новая</span>':'')+'</span><span class="row-s">'+esc(PR(a.pid).name)+(t?' · '+esc(t.title):'')+'</span></span><span class="row-r"><span class="ref-v">v'+l.n+'</span><span class="hide-s">'+esc(verAuthor(l))+' · '+esc(timeOf(l))+'</span></span></a>';
}
function viewHome(){
  var h='<div class="col wide"><div class="page-head"><div class="eyebrow"><span class="tag dash">вымышленная команда</span></div><h1 class="ph">'+esc(S.team.name)+'</h1><p class="lead">Общие проекты, треды и артефакты. Всё открыто всем участникам; «ответственный» означает, кто ведёт работу, а не кто может её видеть.</p>';
  h+='<div class="people">'+S.order.map(function(id){var p=P(id);return '<div class="person">'+avatar(id,'lg')+'<div>'+esc(p.name)+(me(id)?' <span class="you">вы</span>':'')+'<small>'+esc(p.role)+' · '+(online(id)?'в сети':'не в сети')+'</small></div></div>'}).join('')+'</div></div>';
  var ths=S.threads.slice().sort(function(a,b){return unread(b.id)-unread(a.id)||(b.lastT||0)-(a.lastT||0)});
  h+='<section class="sec"><h2 class="sec-h">Продолжить <small>треды команды, новое — сверху</small><button class="btn" type="button" data-act="newThread">'+ic('plus','sm')+'Новый тред</button></h2><div class="rows">'+ths.slice(0,5).map(threadRow).join('')+'</div></section>';
  h+='<section class="sec"><h2 class="sec-h">Проекты</h2><div class="rows">'+S.projects.map(function(p){var n=S.threads.filter(function(t){return t.pid===p.id}).length,na=S.arts.filter(function(a){return a.pid===p.id}).length;return '<a class="row-item" href="#/p/'+p.id+'"><span class="row-ic">'+ic('folder','sm')+'</span><span class="row-main"><span class="row-t"><span>'+esc(p.name)+'</span></span><span class="row-s">'+esc(p.desc)+'</span></span><span class="row-r">'+avatar(p.owner)+'<span class="hide-s">'+n+' тр. · '+na+' арт.</span></span></a>'}).join('')+'</div></section>';
  h+='<section class="sec"><h2 class="sec-h">Недавние артефакты</h2><div class="rows">'+S.arts.map(artRow).join('')+'</div></section></div>';
  return h;
}
function viewProject(p){
  var ths=S.threads.filter(function(t){return t.pid===p.id}),arts=S.arts.filter(function(a){return a.pid===p.id});
  var h='<div class="col wide"><div class="page-head"><div class="eyebrow">Проект · ответственный '+esc(nm(p.owner))+' · открыт всей команде</div><h1 class="ph">'+esc(p.name)+'</h1><p class="lead">'+esc(p.desc)+'</p></div>';
  h+='<section class="sec"><h2 class="sec-h">Треды <small>'+ths.length+'</small><button class="btn" type="button" data-act="newThread" data-pid="'+p.id+'">'+ic('plus','sm')+'Новый тред</button></h2><div class="rows">'+(ths.length?ths.map(threadRow).join(''):'<p class="note">Тредов пока нет.</p>')+'</div></section>';
  h+='<section class="sec"><h2 class="sec-h">Артефакты <small>'+arts.length+'</small></h2><div class="rows">'+(arts.length?arts.map(artRow).join(''):'<p class="note">Артефакты появятся, когда кто-то сохранит результат треда.</p>')+'</div></section></div>';
  return h;
}
function viewBots(){
  var h='<div class="col wide"><div class="page-head"><h1 class="ph">Боты команды</h1><p class="lead">Переиспользуемые конфигурации: инструкции и источники. Любой участник может выбрать бота в любом треде — сообщение увидит вся команда.</p></div><div class="rows">';
  h+=S.bots.map(function(b){var used=S.threads.filter(function(t){return (S.msgs[t.id]||[]).some(function(m){return m.bot===b.id})}).length;
    return '<button class="row-item" type="button" data-act="selBot" data-id="'+b.id+'" aria-pressed="'+(U.selBot===b.id)+'">'+botAv()+'<span class="row-main"><span class="row-t"><span>'+esc(b.name)+'</span></span><span class="row-s">'+esc(b.desc)+'</span></span><span class="row-r">'+avatar(b.owner)+'<span class="hide-s">в '+used+' тр.</span></span></button>'}).join('');
  return h+'</div><p class="note">Создание и редактирование ботов — в следующей версии.</p></div>';
}
function viewArts(){
  var types=[['all','Все'],['Документ','Документы'],['Таблица','Таблицы']];
  return '<div class="col wide"><div class="page-head"><h1 class="ph">Артефакты</h1><p class="lead">Живые документы команды. Каждое сохранение — новая версия; видно, кто её сделал и в каком треде.</p></div>'+
    '<div class="toolbar"><div class="filter">'+ic('search')+'<input id="artQ" type="search" placeholder="Фильтр по названию и тексту" aria-label="Фильтр артефактов" autocomplete="off" maxlength="60" value="'+esc(U.artQ)+'"></div><div class="seg" role="group" aria-label="Тип">'+types.map(function(x){return '<button type="button" data-act="artType" data-t="'+x[0]+'" aria-pressed="'+(U.artType===x[0])+'">'+x[1]+'</button>'}).join('')+'</div></div><div class="rows" id="artList"></div><p class="note">Шаблоны артефактов — в следующей версии.</p></div>';
}
function renderArtList(){
  var el=$('#artList');if(!el)return;var q=U.artQ.trim().toLowerCase();
  var list=S.arts.filter(function(a){return (U.artType==='all'||a.type===U.artType)&&(!q||a.title.toLowerCase().indexOf(q)>-1||last(a).body.toLowerCase().indexOf(q)>-1)});
  el.innerHTML=list.length?list.map(artRow).join(''):'<p class="note" style="padding:8px 6px">Ничего не найдено.</p>';
}
function viewDoc(r){
  var a=A(r.aid),L=last(a),vn=r.ver||L.n,v=a.versions[vn-1],t=T(a.tid),h='<div class="col">';
  if(U.docNew&&U.docNew.aid===a.id){
    var nv=a.versions.filter(function(x){return x.n>U.docNew.from});
    if(nv.length)h+='<div class="banner" role="status">'+ic('history')+'<div><b>Пока вас не было</b><ul>'+nv.map(function(x){return '<li>v'+x.n+' — '+esc(verAuthor(x))+(x.note?': «'+esc(x.note)+'»':'')+'</li>'}).join('')+'</ul></div></div>';
  }
  if(vn<L.n)h+='<div class="banner">'+ic('info')+'<div>Вы смотрите <b>v'+vn+'</b>. Актуальная версия — v'+L.n+'. <a class="link" href="#/a/'+a.id+'">Открыть актуальную</a></div></div>';
  h+='<div class="doc-head"><div class="doc-meta"><span class="tag">'+esc(a.type)+'</span><span>v'+vn+' из '+L.n+' · '+esc(verAuthor(v))+' · '+esc(timeOf(v))+'</span></div><div class="doc-actions">';
  if(!U.edit){
    if(vn===L.n)h+='<button class="btn" type="button" data-act="editArt" data-aid="'+a.id+'">'+ic('edit','sm')+'Редактировать</button>';
    else h+='<button class="btn" type="button" data-act="restore" data-aid="'+a.id+'" data-v="'+vn+'">'+ic('history','sm')+'Восстановить как v'+(L.n+1)+'</button>';
    if(vn>1)h+='<button class="btn" type="button" data-act="toggleDiff" aria-pressed="'+U.diff+'">'+ic('compare','sm')+'Сравнить с v'+(vn-1)+'</button>';
    if(t)h+='<a class="btn ghost" href="#/t/'+t.id+'">'+ic('thread','sm')+'<span class="hide-m">В тред</span></a>';
  }
  h+='</div></div>';
  if(U.edit){
    h+='<form class="edit" data-form="saveArt" style="margin-top:16px"><div class="field"><label for="artBody">Текст · строки «# » и «## » — заголовки, «- » — пункты, « | » — ячейки таблицы</label><textarea id="artBody" class="inp" maxlength="20000" spellcheck="true">'+esc(L.body)+'</textarea></div>'+
      '<div class="field"><label for="artNote">Что изменилось</label><input id="artNote" class="inp" maxlength="140" placeholder="Например: заполнен блок про цену"></div>'+
      '<div class="edit-bar"><span class="hint">Версия v'+(L.n+1)+' сохранится только в этом браузере и сразу будет видна другим демо-персонам.</span><button class="btn" type="button" data-act="cancelEdit">Отмена</button><button class="btn primary" type="submit">Сохранить как v'+(L.n+1)+'</button></div></form>';
  }else if(U.diff&&vn>1){
    var d=diffLines(a.versions[vn-2].body,v.body);
    h+=d?'<p class="diff-legend">Изменения v'+(vn-1)+' → v'+vn+' по строкам</p><div class="diff">'+d.map(function(x){return '<div class="dl'+(x[0]==='+'?' add':x[0]==='-'?' del':'')+'">'+esc(x[1])+'</div>'}).join('')+'</div>':'<p class="note">Документ слишком большой для сравнения в прототипе.</p>';
  }else h+='<article class="doc">'+md(v.body)+'</article>';
  return h+'</div>';
}

/* ------------------------------------------------------------------ inspector */
function renderInsp(){
  var r=U.route,el=$('#insp'),h='';
  var close='<button class="icon-btn" type="button" data-act="insp" aria-label="Закрыть инспектор">'+ic('x')+'</button>';
  if(r.v==='thread'){
    var t=T(r.tid);
    h='<div class="insp-head"><span class="t">Контекст треда</span>'+close+'</div><div class="tabs" role="tablist">'+[['arts','Артефакты'],['src','Источники'],['people','Участники']].map(function(x){return '<button class="tab" type="button" role="tab" data-act="inspTab" data-tab="'+x[0]+'" aria-selected="'+(U.inspTab===x[0])+'">'+x[1]+'</button>'}).join('')+'</div><div class="insp-body" role="tabpanel">';
    if(U.inspTab==='src'){
      var src=S.sources[t.id]||[];
      h+=src.length?src.map(function(s){return '<div class="src">'+ic('source')+'<div>'+esc(s[0])+'<small>'+esc(s[1])+'</small></div></div>'}).join(''):'<p class="note">Источники не подключены.</p>';
      h+='<p class="note">Демо-источники: только названия, содержимое не загружается. Подключение — в следующей версии.</p>';
    }else if(U.inspTab==='people'){
      h+=participants(t).map(function(id){return '<div class="src">'+avatar(id)+'<div>'+esc(P(id).name)+(me(id)?' <span class="you">вы</span>':'')+'<small>'+esc(P(id).role)+(id===t.owner?' · ответственный':'')+' · '+(online(id)?'в сети':'не в сети')+'</small></div></div>'}).join('');
      h+='<p class="note">Тред видят все '+S.order.length+' участника команды, даже если ещё не писали в нём.</p>';
    }else if(U.inspArt&&A(U.inspArt)){
      h+=inspArtHTML(A(U.inspArt));
    }else{
      var arts=threadArts(t);
      h+=arts.length?arts.map(function(a){var l=last(a),nw=artNewFrom(a.id)!==null;return '<button class="ins-row" type="button" data-act="inspArt" data-aid="'+a.id+'"><span class="row-ic">'+ic(artIcon(a),'sm')+'</span><span class="m"><b>'+esc(a.title)+'</b><small>v'+l.n+' · '+esc(verAuthor(l))+' · '+esc(timeOf(l))+'</small></span>'+(nw?'<span class="newb">новая</span>':'')+'</button>'}).join(''):'<p class="note">В треде пока нет артефактов. Сошлитесь на существующий через кнопку «Артефакт» в поле ввода.</p>';
    }
    h+='</div>';
  }else if(r.v==='doc'){
    var a=A(r.aid),L=last(a),vn=r.ver||L.n,tt=T(a.tid);
    h='<div class="insp-head"><span class="t">История версий</span>'+close+'</div><div class="insp-body"><dl class="kv"><dt>Ответственный</dt><dd>'+esc(nm(a.owner))+'</dd><dt>Проект</dt><dd><a class="link" href="#/p/'+a.pid+'">'+esc(PR(a.pid).name)+'</a></dd>'+(tt?'<dt>Тред</dt><dd><a class="link" href="#/t/'+tt.id+'">'+esc(tt.title)+'</a></dd>':'')+'<dt>Доступ</dt><dd>Вся команда</dd></dl>';
    h+=a.versions.slice().reverse().map(function(x){return '<a class="ver" href="#/a/'+a.id+(x.n===L.n?'':'/v/'+x.n)+'"'+(x.n===vn?' aria-current="page"':'')+'><span class="vn">v'+x.n+'</span><span class="va">'+esc(verAuthor(x))+'</span><span class="vt">'+esc(timeOf(x))+'</span>'+(x.note?'<span class="vnote">'+esc(x.note)+'</span>':'')+'</a>'}).join('');
    h+='</div>';
  }else if(r.v==='bots'){
    var b=U.selBot&&S.bots.find(function(x){return x.id===U.selBot});
    h='<div class="insp-head"><span class="t">Бот</span>'+close+'</div><div class="insp-body">';
    if(!b)h+='<p class="note">Выберите бота в списке, чтобы посмотреть его инструкции и использовать в треде.</p>';
    else{
      var lt=T(S.lastThread)||S.threads[0];
      var used=S.threads.filter(function(t){return (S.msgs[t.id]||[]).some(function(m){return m.bot===b.id})});

function updSend(){var t=U.route.tid,c=t&&S.comp[t];$('#sendBtn').classList.toggle('ready',!!($('#msg').value.trim()||(c&&c.refs.length)))}
function autosize(){var ta=$('#msg');ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,200)+'px'}

function send(){
  var t=T(U.route.tid);if(!t)return;
  var ta=$('#msg'),text=ta.value.trim().slice(0,4000),c=compFor(t.id);
  if(!text&&!c.refs.length){ta.focus();return}
  var ms=S.msgs[t.id],now=Date.now();
  var known=ms.some(function(m){return m.a===S.persona||m.by===S.persona});
  if(!known)ms.push({id:uid(),k:'ev',ev:'join',a:S.persona,t:now});
  var m={id:uid(),k:'h',a:S.persona,t:now,text:text};
  if(c.bot)m.bot=c.bot;
  if(c.refs.length)m.refs=c.refs.filter(function(x){return A(x.a)}).map(function(x){return {a:x.a,v:last(A(x.a)).n}});
  ms.push(m);t.lastT=now;S.comp[t.id]={bot:null,refs:[]};delete S.drafts[t.id];
  S.seen[S.persona].t[t.id]=ms.length;U.newFrom=null;
  ta.value='';autosize();save();
  renderView();renderSide();renderComposer();renderInsp();renderTop();
  var sc=$('#scroll');sc.scrollTop=sc.scrollHeight;
  if(m.bot)toast('Отправлено. Бот выбран, но модель в прототипе не вызывается.');
}

  rmRef:function(el){var c=compFor(U.route.tid);c.refs=c.refs.filter(function(x){return x.a!==el.dataset.aid});save();renderComposer();$('#msg').focus()},
  selBot:function(el){U.selBot=el.dataset.id;renderView();renderInsp();if(isSmall())setDrawer('insp');var b=$('[data-act="selBot"][data-id="'+U.selBot+'"]');if(b&&!isSmall())b.focus()},
  useBot:function(el){var tid=T(S.lastThread)?S.lastThread:S.threads[0].id;compFor(tid).bot=el.dataset.id;save();nav('#/t/'+tid);setTimeout(function(){$('#msg').focus()},60);toast('Бот «'+B(el.dataset.id).name+'» выбран для следующего сообщения')},
  artType:function(el){U.artType=el.dataset.t;$$('.seg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.t===U.artType))});renderArtList()},
  srGo:function(el,e){e.preventDefault();var h=el.getAttribute('href');if(el.dataset.flash)U.flash=el.dataset.flash;closeModal();nav(h)}
};
function cancelEdit(){
  var ta=$('#artBody'),a=A(U.route.aid);
  if(ta&&a&&ta.value!==last(a).body&&!window.confirm('Отменить несохранённые изменения?'))return;
  U.edit=false;renderView();
}
function addVersion(a,body,note){
  var n=a.versions.length+1,now=Date.now();
  a.versions.push({n:n,a:S.persona,t:now,note:note,body:body});
  var t=T(a.tid);
  if(t){S.msgs[t.id].push({id:uid(),k:'ev',ev:'artifact',a:S.persona,t:now,refs:[{a:a.id,v:n}],note:note});t.lastT=now}
  markSeenA(a.id);U.docNew=null;save();
  toast('Сохранено как v'+n+' — другие персоны увидят это в этом браузере');
  return n;
}

document.addEventListener('click',function(e){
  if(U.drawer==='nav'&&e.target.closest('#nav a[href]'))setTimeout(function(){if(U.drawer==='nav')setDrawer(null)},0);
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=ACT[el.dataset.act];if(!f)return;
  if(el.tagName!=='A'||el.dataset.act==='srGo'){if(el.dataset.act!=='srGo')e.preventDefault()}
  f(el,e);
});
document.addEventListener('mousedown',function(e){
  if(!pop.hidden&&!pop.contains(e.target)&&!(popAnchor&&popAnchor.contains(e.target)))closePop(true);
  if(e.target.matches&&e.target.matches('[data-ov]'))closeModal();
});
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='composer'){e.preventDefault();send();return}
  var k=f.dataset.form;if(!k)return;e.preventDefault();
  if(k==='newThread'){
    var title=$('#ntTitle').value.trim().slice(0,120),pid=$('#ntProj').value;
    if(!title||!PR(pid)){$('#ntTitle').focus();return}
    var id='t'+uid(),now=Date.now();
    S.threads.push({id:id,pid:pid,title:title,owner:S.persona,lastT:now});
    S.msgs[id]=[{id:uid(),k:'ev',ev:'create',a:S.persona,t:now}];
    S.order.forEach(function(p){S.seen[p].t[id]=p===S.persona?1:0});
    S.collapsed[pid]=false;save();closeModal();nav('#/t/'+id);
    setTimeout(function(){$('#msg').focus()},60);toast('Тред создан и виден всей команде');
  }else if(k==='handoff'){
    var t=T(U.route.tid),sel=f.querySelector('input[name="to"]:checked');if(!t||!sel||!S.people[sel.value])return;
    var note=$('#hoNote').value.trim().slice(0,500),now2=Date.now();
    S.msgs[t.id].push({id:uid(),k:'ev',ev:'handoff',a:S.persona,to:sel.value,t:now2,note:note});
    t.owner=sel.value;t.lastT=now2;S.seen[S.persona].t[t.id]=S.msgs[t.id].length;save();closeModal();
    renderAll();var sc=$('#scroll');sc.scrollTop=sc.scrollHeight;toast('Ответственный теперь — '+P(sel.value).short);
  }else if(k==='saveArt'){
    var a=A(U.route.aid);if(!a)return;
    var body=$('#artBody').value.replace(/\r/g,'').slice(0,20000),nt=$('#artNote').value.trim().slice(0,140);
    if(body.trim()===last(a).body.trim()){toast('Изменений нет — новая версия не создана');return}
    addVersion(a,body,nt||'Без описания');U.edit=false;renderAll();$('#scroll').scrollTop=0;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!pop.hidden){e.preventDefault();closePop();return}
    if(layer.firstChild){e.preventDefault();closeModal();return}
    if(U.drawer){e.preventDefault();var opener=U.drawer==='nav'?$('[data-act="menu"]'):$('#top [data-act="insp"]');setDrawer(null,opener);return}
    if(U.edit){e.preventDefault();cancelEdit();return}
    return;
  }
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''))||e.target.isContentEditable;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(layer.firstChild)closeModal();openSearch();return}
  if(e.key==='/'&&!typing&&!layer.firstChild){e.preventDefault();openSearch();return}
  if(layer.firstChild&&e.key==='Tab'){
    var fs=$$('a[href],button:not([disabled]),input,textarea,select',layer).filter(function(x){return x.offsetParent!==null});
    if(!fs.length)return;var first=fs[0],lst=fs[fs.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();lst.focus()}
    else if(!e.shiftKey&&document.activeElement===lst){e.preventDefault();first.focus()}
  }
  if(layer.querySelector('.search')&&(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter')){
    var items=$$('.sr-item',layer),i=items.indexOf(document.activeElement);
    if(e.key==='Enter'&&e.target.id==='q'){if(items[0]){e.preventDefault();items[0].click()}return}
    if(e.key==='ArrowDown'){e.preventDefault();(items[i+1]||items[0]||{focus:function(){}}).focus()}
    if(e.key==='ArrowUp'){e.preventDefault();if(i<=0)$('#q').focus();else items[i-1].focus()}
  }
  if(!pop.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
    var pi=$$('button,a',pop),j=pi.indexOf(document.activeElement);if(!pi.length)return;e.preventDefault();
    pi[(j+(e.key==='ArrowDown'?1:-1)+pi.length)%pi.length].focus();
  }
});

var msgEl=$('#msg');
msgEl.addEventListener('input',function(){autosize();updSend();if(U.route.v==='thread'){var v=msgEl.value;if(v)S.drafts[U.route.tid]=v.slice(0,4000);else delete S.drafts[U.route.tid];save()}});
msgEl.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$('#sideFilter').addEventListener('input',function(e){U.filter=e.target.value.slice(0,60);renderSide()});
document.addEventListener('input',function(e){if(e.target.id==='artQ'){U.artQ=e.target.value.slice(0,60);renderArtList()}});
window.addEventListener('hashchange',function(){onRoute();loadDraft()});
window.addEventListener('storage',function(e){if(e.key===KEY){load();renderAll()}});
var wasSmall=isSmall();
window.addEventListener('resize',function(){var s=isSmall();if(s!==wasSmall){wasSmall=s;U.drawer=null;applyLayout();renderTop()}});

if(!location.hash)history.replaceState(null,'','#/t/'+S.lastThread);
onRoute();loadDraft();
})();
</script>
</body>
